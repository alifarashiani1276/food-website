<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="./images/logo-delino-rispons.svg" type="image/x-icon" >
  <title>ایجاد حساب کاربری</title>
  <style>
    :root{
      --bg: #fff6f3;
      --accent: #EF4123;
      --accent-600: #f12b08;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --error: #e11d48;
      --radius: 16px;
    }

    body{
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        repeating-linear-gradient(
          135deg,
          rgba(241,43,8,0.02) 0px,
          rgba(241,43,8,0.02) 1px,
          transparent 1px,
          transparent 8px
        ),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, "IRANSans", Tahoma, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card{
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
    }

    .header{
      padding: 28px 28px 12px;
      text-align: center;
    }
    .brand{
      display: inline-flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(239,65,35,.10);
      color: var(--accent-600);
      font-weight: 700;
    }

    h1{
      margin: 14px 0 6px;
      font-size: 1.35rem;
    }
    .subtitle{
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }

    form{
      padding: 24px 28px 28px;
      display: grid;
      gap: 16px;
      padding-left: 50px;
    }

    .field{
      display: grid;
      gap: 8px;
    }
    label{
      font-size: .9rem;
    }
    input{
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      outline: none;
      font-size: 0.95rem;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(239,65,35,.20);
    }
    input::placeholder{ color: #9ca3af; }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-600), var(--accent));
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease, box-shadow .2s;
      box-shadow: 0 6px 14px rgba(239,65,35,.35);
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn:active{ transform: translateY(1px); }

    .footer{
      padding: 16px 28px 28px;
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }
    .link{
      color: var(--accent-600);
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover{ text-decoration: underline; }

    @media (max-width: 360px){
      .card{ border-radius: 0; box-shadow: none; }
      body{ padding: 0; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="header">
      <div class="brand">ثبت نام</div>
      <h1>ساخت حساب کاربری</h1>
      <p class="subtitle">اطلاعات خود را وارد کنید تا حساب جدید ایجاد شود</p>
    </div>

    <form action="/signup" method="post" id="signup">
      <div class="field">
        <label for="fullname">نام  کاربری</label>
        <input id="fullname" name="fullname" type="text" placeholder="نام کامل" required>
      </div>

      <div class="field">
        <label for="email">ایمیل</label>
        <input id="email" name="email" type="email" placeholder="example@email.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" placeholder="••••••••" minlength="3" required  autocomplete="new-password">
      </div>

      <div class="field">
        <label for="confirm">تکرار رمز عبور</label>
        <input id="confirm" name="confirm" type="password" placeholder="تکرار رمز عبور" minlength="3" required autocomplete="new-password">
      </div>

      <button class="btn" type="submit">ثبت نام</button>
    </form>

    <div class="footer">
      حساب دارید؟
      <a class="link" href="./login.html">ورود به حساب</a>
    </div>
  </main>
  <script src="./signup.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
