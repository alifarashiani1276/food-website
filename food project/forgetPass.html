<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="./images/sofreh-brand.svg" type="image/x-icon" >
  <title>بازیابی رمز عبور</title>
  <style>
    /* از همان تم login استفاده شده */
    :root{
      --bg: #f3f8f7; 
      --accent: #0f766e; 
      --accent-600: #115e59; 
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --error: #e11d48;
      --radius: 16px;
    }
    body{
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        repeating-linear-gradient(
          135deg,
          rgba(15,118,110,0.025) 0px,
          rgba(15,118,110,0.025) 1px,
          transparent 1px,
          transparent 8px
        ),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, "IRANSans", Tahoma, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card{
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
    }
    .header{
      padding: 28px 28px 12px;
      text-align: center;
    }
    .brand{
      display: inline-flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(239,65,35,.10);
      color: var(--accent-600);
      font-weight: 700;
    }
    h1{
      margin: 14px 0 6px;
      font-size: 1.35rem;
    }
    .subtitle{
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }
    form{
      padding: 24px 28px 28px;
      display: grid;
      gap: 16px;
      padding-left: 50px;
    }
    .field{
      display: grid;
      gap: 8px;
    }
    label{
      font-size: .9rem;
    }
    .control{
      position: relative;
    }
    input[type="email"]{
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      outline: none;
      font-size: 0.95rem;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input::placeholder{ color: #9ca3af; }
    input:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(239,65,35,.20);
    }
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-600), var(--accent));
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease, box-shadow .2s;
      box-shadow: 0 6px 14px rgba(239,65,35,.35);
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn:active{ transform: translateY(1px); }
    .footer{
      padding: 16px 28px 28px;
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }
    .footer .link {
     display: inline-flex;
     align-items: center;
     justify-content: center;
     padding: 10px 16px;
     background: linear-gradient(90deg, var(--accent-600), var(--accent));
     color: #fff;
     font-weight: 700;
     border-radius: 12px;
     text-decoration: none;
     box-shadow: 0 6px 14px rgba(239,65,35,.35);
     transition: transform .06s ease, filter .2s ease, box-shadow .2s;
}

.footer .link:hover {
  filter: brightness(1.05);
  text-decoration: none;
}

.footer .link:active {
  transform: translateY(1px);
}

  
    .brand-mark {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin: 0 auto 12px;
    }
    .card {
      border: 1px solid rgba(15, 118, 110, .12);
      box-shadow: 0 18px 55px rgba(17, 94, 89, .10);
    }
    .btn, button[type="submit"] {
      background: linear-gradient(135deg, #0f766e, #115e59) !important;
      box-shadow: 0 8px 18px rgba(15, 118, 110, .18);
    }
    .btn:hover, button[type="submit"]:hover {
      filter: brightness(.96);
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0f766e !important;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
      outline: none;
    }

  
    .brand-mark { display:block; width:74px; height:74px; object-fit:contain; margin:0 auto 12px; }
    .card { border:1px solid rgba(15,118,110,.12); box-shadow:0 18px 55px rgba(17,94,89,.10); }
    .btn, button[type="submit"] { background:linear-gradient(135deg,#0f766e,#115e59) !important; box-shadow:0 8px 18px rgba(15,118,110,.18); }
    .btn:hover, button[type="submit"]:hover { filter:brightness(.96); }
    input:focus, select:focus, textarea:focus { border-color:#0f766e !important; box-shadow:0 0 0 3px rgba(15,118,110,.12); outline:none; }

  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="header">
      <img class="brand-mark" src="./images/sofreh-brand.svg" alt="سفره">
      <div class="brand" aria-label="Brand"><span>بازیابی رمز عبور</span></div>
      <h1>رمز عبور خود را بازیابی کنید</h1>
      <p class="subtitle">لطفاً ایمیل خود را وارد کنید تا کد بازیابی ارسال شود</p>
    </div>

    <form id="forgotPassword" novalidate>
      <div class="field">
        <label for="email">لطفاً e-mail خود را جهت بازیابی رمز عبور وارد کنید</label>
        <div class="control">
          <input id="email" name="email" type="email" placeholder="example@email.com" required>
        </div>
      </div>
      <button class="btn" type="submit">ارسال کد به ایمیل</button>
    </form>

    <div class="footer">
      <a class="link" href="./login.html">بازگشت به ورود</a>
    </div>
  </main>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.querySelector("#forgotPassword").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.querySelector("#email").value.trim();

      if(!email){
        Swal.fire({
          icon: "error",
          title: "خطا",
          text: "لطفاً ایمیل خود را وارد کنید ❌",
          confirmButtonColor: "#0f766e"
        });
        return;
      }

      // شبیه‌سازی ارسال کد به ایمیل
      Swal.fire({
        icon: "success",
        title: "کد ارسال شد ✅",
        text: `کد بازیابی به ${email} ارسال شد.`,
        confirmButtonText: "باشه",
        confirmButtonColor: "#28a745"
      });
    });
  </script>
</body>
</html>
