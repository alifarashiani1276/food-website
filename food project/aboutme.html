<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اطلاعات کاربری</title>
  <style>
    :root{
      --bg: #f3f8f7;
      --accent: #0f766e;
      --accent-600: #115e59;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --error: #e11d48;
      --radius: 16px;
    }

    body{
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        repeating-linear-gradient(
          135deg,
          rgba(15,118,110,0.025) 0px,
          rgba(15,118,110,0.025) 1px,
          transparent 1px,
          transparent 8px
        ),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, "IRANSans", Tahoma, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card{
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
    }

    .header{
      padding: 28px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .header h1{
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent-600);
    }

    .content{
      padding: 24px 28px;
      display: grid;
      gap: 20px;
    }

    .info-item{
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: .95rem;
    }
    .info-item span:first-child{
      color: var(--muted);
    }
    .info-item span:last-child{
      font-weight: 600;
      color: var(--text);
    }

    .footer{
      padding: 20px 28px;
      text-align: center;
      border-top: 1px solid #eee;
    }
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-600), var(--accent));
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease, box-shadow .2s;
      box-shadow: 0 6px 14px rgba(239,65,35,.35);
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn:active{ transform: translateY(1px); }

    @media (max-width: 360px){
      .card{ border-radius: 0; box-shadow: none; }
      body{ padding: 0; }
    }
  
    .brand-mark {
      display: block;
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin: 0 auto 12px;
    }
    .card {
      border: 1px solid rgba(15, 118, 110, .12);
      box-shadow: 0 18px 55px rgba(17, 94, 89, .10);
    }
    .btn, button[type="submit"] {
      background: linear-gradient(135deg, #0f766e, #115e59) !important;
      box-shadow: 0 8px 18px rgba(15, 118, 110, .18);
    }
    .btn:hover, button[type="submit"]:hover {
      filter: brightness(.96);
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0f766e !important;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .12);
      outline: none;
    }

  
    .brand-mark { display:block; width:74px; height:74px; object-fit:contain; margin:0 auto 12px; }
    .card { border:1px solid rgba(15,118,110,.12); box-shadow:0 18px 55px rgba(17,94,89,.10); }
    .btn, button[type="submit"] { background:linear-gradient(135deg,#0f766e,#115e59) !important; box-shadow:0 8px 18px rgba(15,118,110,.18); }
    .btn:hover, button[type="submit"]:hover { filter:brightness(.96); }
    input:focus, select:focus, textarea:focus { border-color:#0f766e !important; box-shadow:0 0 0 3px rgba(15,118,110,.12); outline:none; }

  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <img class="brand-mark" src="./images/sofreh-brand.svg" alt="سفره">
      <h1>اطلاعات کاربری</h1>
    </div>
    <div class="content">
      <div class="info-item">
        <span>نام کاربر:</span>
        <span id="userName"></span>
      </div>
      <div class="info-item">
        <span>ایمیل:</span>
        <span id="email"></span>
      </div>
      <div class="info-item">
        <span>تاریخ عضویت:</span>
        <span id="dateMembership"></span>
      </div>
    </div>
    <div class="footer">
      <button class="btn"  onclick="window.location.href='editInfo.html'">ویرایش اطلاعات</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./abouteme.js"></script>
</body>
</html>
